<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    if (location.hostname === 'doeonon.github.io' &&
        ['/portal_interaction/', '/portal_interaction/index.html'].includes(location.pathname)) {
      location.replace('./%EB%B3%B4%EB%9D%BC%EB%B9%9B_%EB%B9%84%EB%B0%80%EC%9D%98_%EC%88%B2.html');
    }
  </script>
  <title>숲 속의 나.v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="forest" aria-label="돋보기로 어두운 숲에 숨은 요정 10마리를 찾아보세요">
    <div class="scene night" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="magnifier" aria-hidden="true">
      <div class="magnified-world">
        <div class="scene"></div>
        <div id="fairy" class="hidden-fairy">
          <img id="fairy-art" src="assets/fairy.png" alt="" draggable="false">
          <canvas id="face-portrait" width="308" height="210" aria-hidden="true"></canvas>
        </div>
      </div>
    </div>
    <div class="magnifier-frame" aria-hidden="true"></div>
    <canvas id="flower-trail" aria-hidden="true"></canvas>
    <div class="final-forest" aria-hidden="true"></div>
    <canvas id="flowers" aria-hidden="true"></canvas>
    <div class="flower-aura" aria-hidden="true"></div>
    <img class="cursor-flower" src="flower.png" alt="" draggable="false">
    <header class="intro" id="fairy-intro">
      <h1>숲 속의 나.v2</h1>
      <p>돋보기 안에 나타난 요정을 클릭해 보세요.<br>효과음을 켜면 요정에 가까워질수록 차임벨이 또렷해져요.</p>
      <div class="search-progress" aria-live="polite" aria-atomic="true">
        <div class="search-count"><span>찾은 요정</span><strong id="fairy-count">0/10</strong></div>
        <progress id="fairy-progress" value="0" max="10" aria-label="찾은 요정 수"></progress>
        <div id="fairy-message"></div>
      </div>
    </header>
    <header class="intro" id="flower-intro" hidden>
      <h1>방울꽃이 피는 숲</h1>
      <p id="flower-instructions" role="status">방울꽃을 움직여 숲을 밝히고, 좌우로 흔들어 빛을 채워보세요.</p>
      <div class="search-progress">
        <div class="search-count"><span>빛 게이지</span><strong id="light-count">0%</strong></div>
        <progress id="light-progress" value="0" max="100" aria-label="빛 게이지"></progress>
      </div>
    </header>
    <dialog id="flower-mission" aria-labelledby="flower-mission-title">
      <form method="dialog">
        <h2 id="flower-mission-title">어두운 숲속을 밝혀줘!</h2>
        <p>방울꽃이 지나간 자리에 빛이 남아요.<br>마우스를 빠르게 좌우로 흔들면 빛 게이지가 차올라요.</p>
        <button type="submit" autofocus>숲 밝히기</button>
      </form>
    </dialog>
    <p id="hint">클릭하면 방울꽃이 피어요</p>
    <div class="toolbar">
    <button id="background-button" type="button">숲 이미지 바꾸기</button>
    <button id="background-reset" type="button" hidden>기본 숲으로</button>
    <button id="chime-button" type="button" aria-pressed="false">효과음 켜기</button>
    <button id="camera-button" type="button" aria-pressed="false"><span class="camera-dot" aria-hidden="true"></span><span>웹캠 켜기</span></button>
    <button id="fullscreen" type="button" aria-label="전체 화면으로 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
      <span>전체 화면</span>
    </button>
    </div>
    <p id="camera-status" role="status" aria-live="polite">웹캠을 켜면 내 얼굴이 요정 안에 나타나요.<br>영상은 이 PC에서만 처리하며 저장·전송하지 않아요.</p>
    <p id="notice" role="status"></p>
    <video id="camera-video" autoplay muted playsinline hidden></video>
    <input id="background-file" type="file" accept="image/*" hidden aria-label="숲 배경으로 사용할 이미지 선택">
  </main>
  <script src="vendor/face-api/face-api.min.js"></script>
  <script src="vendor/face-api/model-data.js"></script>
  <script src="forest.js"></script>
  <script src="webcam.js"></script>
  <script src="background.js"></script>
</body>
</html>
