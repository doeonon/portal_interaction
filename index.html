<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숲 속의 나.v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="forest" aria-label="마우스를 움직이면 보랏빛 조명과 요정이 따라오고 멈추면 서서히 어둠 속으로 사라지는 비밀의 숲">
    <div class="scene night" aria-hidden="true"></div>
    <div class="scene illuminated" aria-hidden="true"></div>
    <div class="bloom" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="spark" aria-hidden="true"></div>
    <canvas id="dust" aria-hidden="true"></canvas>
    <div id="fairy" aria-hidden="true">
      <img id="fairy-art" src="assets/fairy.png" alt="" draggable="false">
      <canvas id="face-portrait" width="308" height="210" aria-hidden="true"></canvas>
    </div>
    <header class="intro">
      <h1>숲 속의 나.v2</h1>
      <p>마우스를 움직이면 보라빛 요정이 나타나 따라옵니다.<br>멈추면 숲과 요정이 서서히 사라집니다.</p>
    </header>
    <p id="hint">누른 채 천천히 움직이면 흰빛 먼지가 남아요</p>
    <div class="toolbar">
    <button id="background-button" type="button">숲 이미지 바꾸기</button>
    <button id="background-reset" type="button" hidden>기본 숲으로</button>
    <button id="camera-button" type="button" aria-pressed="false"><span class="camera-dot" aria-hidden="true"></span><span>웹캠 켜기</span></button>
    <button id="fullscreen" type="button" aria-label="전체 화면으로 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
      <span>전체 화면</span>
    </button>
    </div>
    <p id="camera-status" role="status" aria-live="polite">웹캠을 켜면 내 얼굴이 요정 안에 나타나요.<br>영상은 이 PC에서만 처리하며 저장·전송하지 않아요.</p>
    <p id="notice" role="status"></p>
    <video id="camera-video" autoplay muted playsinline hidden></video>
    <input id="background-file" type="file" accept="image/*" hidden aria-label="숲 배경으로 사용할 이미지 선택">
  </main>
  <script src="vendor/face-api/face-api.min.js"></script>
  <script src="vendor/face-api/model-data.js"></script>
  <script src="forest.js"></script>
  <script src="webcam.js"></script>
  <script src="background.js"></script>
</body>
</html>
